[package]
name = "tro-desktop"
version.workspace = true
edition.workspace = true
publish = false
[lib]
name = "tro_desktop"
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-opener", "dep:keyring"]
tauri-plugin-global-shortcut = ["dep:tauri-plugin-global-shortcut"]
[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true , features = [] }
[dependencies]
tauri = { version = "=2.11.3", optional = true , features = ["macos-private-api"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest.workspace = true
time.workspace = true
base64.workspace = true
rand.workspace = true
async-trait.workspace = true
sha2 = "=0.10.9"
url = "=2.5.7"
tro-contracts = { path = "../../../packages/contracts" }
tauri-plugin-global-shortcut = { version = "=2.3.2", optional = true }
tauri-plugin-opener = { version = "=2.5.5", optional = true }
keyring = { version = "=4.2.0", optional = true }
[dev-dependencies]
tempfile = "=3.23.0"
[[bin]]
name = "tro-desktop"
path = "src/main.rs"
required-features = ["desktop"]
