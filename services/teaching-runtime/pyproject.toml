[project]
name = "tro-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cua-driver==0.28.1",
    "jsonschema==4.26.0",
    "openai-agents==0.22.2",
    "pydantic==2.12.5",
]
[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tro_runtime"]
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.0",
    "mypy==1.19.1",
    "types-jsonschema==4.26.0.20260202",
    "datamodel-code-generator==0.64.0",
    "pip-audit==2.10.0",
    "pyinstaller==6.22.3",
]
[tool.ruff]
line-length = 100
extend-exclude = ["src/tro_runtime/generated.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"src/tro_runtime/generated.py" = ["ALL"]
[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = "tro_runtime.generated"
ignore_errors = true
[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "cua_driver.*"
ignore_missing_imports = true
