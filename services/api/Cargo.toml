[package]
name = "tro-api"
version.workspace = true
edition.workspace = true
publish = false
[dependencies]
axum = { version = "=0.8.6", features = ["multipart"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
time.workspace = true
base64.workspace = true
rand.workspace = true
hmac.workspace = true
async-trait.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }
sha2 = "=0.10.9"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
object_store = { version = "=0.14.2", features = ["aws"] }
url = "=2.5.7"
hound = "=3.5.1"
tro-api-migration = { path = "migration" }
tro-contracts = { path = "../../packages/contracts" }
[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
