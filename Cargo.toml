[workspace]
members = ["apps/desktop/src-tauri", "services/api", "services/api/migration", "packages/contracts"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
publish = false
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "net", "signal"] }
thiserror = "=2.0.20"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "=2.0.3", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-time", "with-uuid"] }
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde"] }
base64 = "=0.22.1"
rand = "=0.9.5"
hmac = "=0.12.1"
async-trait = "=0.1.89"
[profile.dev]
debug = 1
[profile.release]
lto = "thin"
strip = "symbols"
