[package]
name = "tro-contracts"
version.workspace = true
edition.workspace = true
publish = false
[features]
codegen = ["dep:typify", "dep:schemars", "dep:prettyplease", "dep:syn"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonschema = { version = "=0.33.0", default-features = false }
regress = "=0.10.4"
typify = { version = "=0.5.0", optional = true }
schemars = { version = "=0.8.22", optional = true }
prettyplease = { version = "=0.2.37", optional = true }
syn = { version = "=2.0.106", features = ["full"], optional = true }
[[bin]]
name = "contracts-gen"
path = "codegen/main.rs"
required-features = ["codegen"]
