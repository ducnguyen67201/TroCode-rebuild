name: tro-rebuild-foundation
services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: tro_rebuild_test
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: ${TRO_DB_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture -d tro_rebuild_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  storage-permissions:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /data"]
    volumes: ["object-data:/data"]
  storage:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${TRO_S3_KEY:?Run npm run setup}
      RUSTFS_SECRET_KEY: ${TRO_S3_SECRET:?Run npm run setup}
    ports: ["127.0.0.1:19000:9000"]
    volumes: ["object-data:/data"]
  bucket:
    image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on: [storage]
    environment:
      TRO_S3_KEY: ${TRO_S3_KEY}
      TRO_S3_SECRET: ${TRO_S3_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        attempts=0;
        rc alias set fixture http://storage:9000 "$$TRO_S3_KEY" "$$TRO_S3_SECRET" >/dev/null 2>&1;
        until rc ready fixture --timeout 2 >/dev/null 2>&1; do
        attempts=$$((attempts+1)); test "$$attempts" -lt 30 || exit 1; sleep 1; done;
        rc mb --ignore-existing fixture/tro-rebuild-fixtures;
        rc anonymous set private fixture/tro-rebuild-fixtures
volumes:
  postgres-data:
  object-data:
